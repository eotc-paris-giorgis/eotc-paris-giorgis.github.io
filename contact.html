<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · Debre Giorgis Paris</title>
  <meta name="description" content="Contacter la paroisse Debre Giorgis, Église orthodoxe éthiopienne Tewahedo à Paris.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Serif+Ethiopic:wght@400;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact" data-title="nav_contact">
  <a class="skip" href="#main">Aller au contenu</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <img src="assets/ethiopian-cross.svg" alt="">
        <span class="brand-text">
          <span class="brand-am">ደብረ ጊዮርጊስ</span>
          <span class="brand-fr">Debre Giorgis · Paris</span>
        </span>
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" data-i18n="menu">Menu</button>
      <nav class="nav" aria-label="Principal">
        <a href="index.html" data-page="home" data-i18n="nav_home">Accueil</a>
        <a href="paroisse.html" data-page="parish" data-i18n="nav_parish">La paroisse</a>
        <a href="offices.html" data-page="hours" data-i18n="nav_hours">Offices</a>
        <a href="actualites.html" data-page="news" data-i18n="nav_news">Actualités</a>
        <a href="contact.html" data-page="contact" data-i18n="nav_contact">Contact</a>
        <div class="lang" role="group" aria-label="Langue">
          <button type="button" data-lang="fr">FR</button>
          <button type="button" data-lang="am">አማ</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </nav>
    </div>
  </header>

  <main id="main">
    <header class="page-hero">
      <div class="wrap">
        <p class="am-title" data-i18n="contact_am"></p>
        <h1 data-i18n="contact_title">Contact</h1>
        <p class="kicker" data-i18n="contact_kicker"></p>
      </div>
    </header>
    <section class="section">
      <div class="wrap">
        <p class="section-intro" data-i18n="contact_intro"></p>
        <div class="contact-grid">
          <div class="card">
            <h3 data-i18n="where_title">Où nous trouver</h3>
            <div id="contact-details"></div>
          </div>
          <form class="card form" id="contact-form">
            <label for="name" data-i18n="label_name">Nom</label>
            <input id="name" name="name" required autocomplete="name">
            <label for="email" data-i18n="label_email">E-mail</label>
            <input id="email" name="email" type="email" required autocomplete="email">
            <label for="message" data-i18n="label_message">Message</label>
            <textarea id="message" name="message" required></textarea>
            <button class="btn" type="submit" data-i18n="send">Préparer le message</button>
            <p class="muted" data-i18n="form_hint"></p>
          </form>
        </div>
        <p style="margin-top:1.6rem">
          <iframe id="map-frame" title="Carte" width="100%" height="320" style="border:1px solid var(--line);background:#fffdf8" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <img class="ornament" src="assets/ornament.svg" alt="">
      <p class="am" data-i18n="footer_blessing">Gloire à Dieu</p>
      <p data-i18n="footer_copy"></p>
      <small>በስመ አብ ወወልድ ወመንፈስ ቅዱስ አሐዱ አምላክ አሜን</small>
    </div>
  </footer>
  <script src="js/content.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
